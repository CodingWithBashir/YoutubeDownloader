name: clearframe

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clearframe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clearframe}
      POSTGRES_DB: clearframe
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clearframe -d clearframe"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-clearframe}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-clearframe-dev-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-clearframe}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-clearframe-dev-secret}
      S3_BUCKET: ${S3_BUCKET:-clearframe}
    entrypoint: >-
      /bin/sh -c "
      until mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\"; do sleep 1; done;
      mc mb --ignore-existing \"local/$$S3_BUCKET\"
      "
    restart: "no"

  db-migrate:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://clearframe:${POSTGRES_PASSWORD:-clearframe}@postgres:5432/clearframe?schema=public
    command: ["node", "scripts/apply-sql-migrations.mjs"]
    restart: "no"

  web:
    build: .
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env before starting Compose}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN in .env before starting Compose}
      DATABASE_URL: postgresql://clearframe:${POSTGRES_PASSWORD:-clearframe}@postgres:5432/clearframe?schema=public
      REDIS_URL: redis://redis:6379
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-clearframe}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-clearframe}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-clearframe-dev-secret}
      S3_FORCE_PATH_STYLE: "true"
      LOCAL_STORAGE_ROOT: /app/storage
    ports:
      - "3000:3000"
    volumes:
      - storage_data:/app/storage
    restart: unless-stopped

  worker:
    build: .
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env before starting Compose}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN in .env before starting Compose}
      DATABASE_URL: postgresql://clearframe:${POSTGRES_PASSWORD:-clearframe}@postgres:5432/clearframe?schema=public
      REDIS_URL: redis://redis:6379
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-clearframe}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-clearframe}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-clearframe-dev-secret}
      S3_FORCE_PATH_STYLE: "true"
      LOCAL_STORAGE_ROOT: /app/storage
    command: ["npm", "run", "worker"]
    volumes:
      - storage_data:/app/storage
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  storage_data:
